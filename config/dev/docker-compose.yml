services:
  mysql:
    image: mysql:5.7
    container_name: db1
    command: --default-authentication-plugin=mysql_native_password
    environment:
      MYSQL_ROOT_PASSWORD: prestashop
      MYSQL_DATABASE: prestashop
    networks:
      - prestashop
    ports:
      - "3307:3306"
    volumes:
      - dbdata:/var/lib/mysql
    cpus: '0.5'
    mem_limit: 1024M

  prestashop:
    build:
      context: ../..
      dockerfile: config/dev/Dockerfile
    container_name: presta1
    environment:
      DB_PASSWD: prestashop
      DB_NAME: prestashop
      DB_PREFIX: ps_
      DB_SERVER: mysql
      DB_USER: root
      PS_COUNTRY: pl
      PS_LANGUAGE: pl
      PS_DEV_MODE: 1
      PS_SMARTY_CACHE: 1
      ADMIN_MAIL: admin@admin.pl
      ADMIN_PASSWD: admin
      PS_FOLDER_ADMIN: admin2137
      PS_FOLDER_INSTALL: install2137
      PS_INSTALL_AUTO: 1
      PS_DOMAIN: localhost:8081
    depends_on:
      - mysql
    networks:
      - prestashop
    ports:
      - "8081:80"
    volumes:
      - ../../prestashop/themes/child_classic:/var/www/html/themes/child_classic
      - psdata:/var/www/html

    cpus: '1.5'
    mem_limit: 2048M


  mailhog:
    image: mailhog/mailhog
    ports:
      - "1125:1025" # SMTP (inne niż prod)
      - "18025:8025" # Web UI (inne niż prod)
    networks:
      - prestashop
    cpus: '0.2'
    mem_limit: 256M

networks:
  prestashop:

volumes:
  dbdata:
  psdata: