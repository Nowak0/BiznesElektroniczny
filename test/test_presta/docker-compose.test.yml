services:
  mysql:
    image: mysql:5.7
    container_name: db1
    command: --default-authentication-plugin=mysql_native_password
    environment:
      MYSQL_ROOT_PASSWORD: prestashop
      MYSQL_DATABASE: prestashop
    networks:
      - prestashop_test
    ports:
      - "3307:3306"
    volumes:
      - dbdata_test:/var/lib/mysql

  prestashop:
    image: prestashop/prestashop:1.7.8
    container_name: presta1
    environment:
      DB_PASSWD: prestashop
      DB_NAME: prestashop
      DB_PREFIX: ps_
      DB_SERVER: mysql
      DB_USER: root
      PS_COUNTRY: pl
      PS_DEV_MODE: 1
      ADMIN_MAIL: admin@admin.pl
      ADMIN_PASSWD: admin
      PS_FOLDER_ADMIN: admin2137
      PS_FOLDER_INSTALL: install2137
      PS_INSTALL_AUTO: 1

      # ważne: ustaw domenę z portem testowym
      PS_DOMAIN: localhost:8081
    depends_on:
      - mysql
    networks:
      - prestashop_test
    ports:
      - "8081:80"
    volumes:
      # tu podmień na skopiowane theme (np. katalogi *_test)
      - ../prestashop/themes/child_classic_test:/var/www/html/themes/child_classic
      - psdata_test:/var/www/html

  mailhog:
    image: mailhog/mailhog
    ports:
      - "1125:1025" # SMTP (inne niż prod)
      - "18025:8025" # Web UI (inne niż prod)
    networks:
      - prestashop_test

networks:
  prestashop_test:

volumes:
  dbdata_test:
  psdata_test:
